<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grate City · Review submissions</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D1C1A;--muted:#6B675F;--line:#E2DFD9;--accent:#B84600;--btn:#C94A00;--soft:#F7F5F1;--ok:#2F6B2A;--bad:#A3260F}
*{box-sizing:border-box}
body{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);background:#fff}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top img{display:block}.top .wm{height:24px;width:auto}
.top h1{font:800 1.15rem/1 "Hanken Grotesk",sans-serif;margin:0 0 0 6px;color:var(--muted)}
.top a{margin-left:auto;color:var(--accent);font-weight:600;font-size:.9rem}
.login{max-width:380px;margin:60px auto;border:1px solid var(--line);border-radius:12px;padding:22px}
.login h2{margin:0 0 6px;font-size:1.2rem}.login p{color:var(--muted);font-size:.9rem;margin:0 0 14px}
input[type=password],input[type=text],input[type=date]{width:100%;font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid #CFCBC2;border-radius:8px;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit}
.primary{font-weight:700;color:#fff;background:var(--btn);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.primary:hover{background:#A93E00}
.ghost{font-weight:600;background:rgba(29,28,26,.07);color:var(--ink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.reject{font-weight:600;background:#fff;color:var(--bad);border:1px solid #E7C1B8;border-radius:8px;padding:10px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--bad);font-size:.9rem;min-height:1em}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--btn)}
.tabs .n{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--soft);font-size:.78rem;margin-left:4px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:260px 1fr;gap:16px}
.card .map{width:100%;height:180px;border-radius:8px;object-fit:cover;background:var(--soft)}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pics img{width:120px;height:120px;object-fit:cover;border-radius:6px;cursor:zoom-in;background:var(--soft)}
.meta{font-size:.85rem;color:var(--muted);margin:0 0 10px;line-height:1.5}
.meta b{color:var(--ink)}
.note{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.9rem;margin:0 0 10px}
.fields{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:8px 10px;margin-bottom:12px}
.fields label{font-size:.78rem;font-weight:700;display:block;margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;font-weight:600}
.sections{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sections button{font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted)}
.sections button[aria-current=page]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sections button[aria-current=page] .n{background:rgba(255,255,255,.2)}
.evhead{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 14px;flex-wrap:wrap}
.evform{grid-template-columns:1fr!important}
.locrow{display:grid;grid-template-columns:1fr 1.5fr 1.5fr auto;gap:8px;margin-bottom:8px;align-items:end}
.locrow label{font-size:.72rem;font-weight:700;display:block;margin-bottom:3px}
.locrow .geo{font-size:.72rem;color:var(--muted);grid-column:1/-1;margin-top:-4px}
input[type=time]{width:100%;font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid #CFCBC2;border-radius:8px;color:var(--ink)}
.req{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.req h3{margin:0 0 4px;font-size:1.05rem}
.req .pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);margin-left:6px}
.req .pill.yes{background:#E3F0E0;color:var(--ok)}
.evrow{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.evrow.past{opacity:.6}
.evrow ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
@media (max-width:720px){.locrow{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:30px 0;text-align:center}
#lb{position:fixed;inset:0;background:rgba(10,12,12,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;z-index:9}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:6px}
@media (max-width:720px){.card{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.svg" alt="" width="26" height="28"><img src="wordmark.svg" alt="Grate City" class="wm" width="100" height="27"><h1>Review submissions</h1><a href="./">Back to the map</a></div>

  <form class="login" id="login" hidden>
    <h2>Admin sign-in</h2>
    <p>Enter the admin key you saved in GitHub as <code>ADMIN_KEY</code>. This browser will remember it.</p>
    <label for="key" style="font-weight:700;font-size:.85rem">Admin key</label>
    <input type="password" id="key" autocomplete="current-password" required style="margin:6px 0 12px">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>

  <div id="app" hidden>
    <nav class="sections" aria-label="Admin sections">
      <button data-sec="subs" aria-current="page">Basin submissions <span class="n" id="n-subs">0</span></button>
      <button data-sec="reqs">Cleanup requests <span class="n" id="n-reqs">0</span></button>
      <button data-sec="evts">Events</button>
    </nav>
    <div id="sec-subs">
    <div class="tabs" role="tablist">
      <button role="tab" data-s="pending" aria-selected="true">Waiting <span class="n" id="n-pending">0</span></button>
      <button role="tab" data-s="approved" aria-selected="false">Approved <span class="n" id="n-approved">0</span></button>
      <button role="tab" data-s="rejected" aria-selected="false">Rejected <span class="n" id="n-rejected">0</span></button>
      <button class="ghost" id="logout" style="margin-left:auto;padding:6px 10px;font-size:.85rem">Sign out</button>
    </div>
    <div id="items" aria-live="polite"></div>
    </div>
    <div id="sec-reqs" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-r="new" aria-selected="true">New <span class="n" id="n-new">0</span></button>
        <button role="tab" data-r="handled" aria-selected="false">Handled <span class="n" id="n-handled">0</span></button>
      </div>
      <div id="reqItems" aria-live="polite"></div>
    </div>
    <div id="sec-evts" hidden>
      <div class="evhead"><p class="meta" style="margin:0">Events dated today or later show on the map under &ldquo;Upcoming cleanups.&rdquo; Past ones drop off on their own.</p><button class="primary" id="newEv">Add an event</button></div>
      <form id="evForm" class="card evform" hidden>
        <div>
          <h3 id="evFormTitle" style="margin:0 0 10px">New event</h3>
          <div class="fields" style="grid-template-columns:2fr 1fr 1fr 1fr">
            <div><label for="eTitle">Title</label><input type="text" id="eTitle" required maxlength="120"></div>
            <div><label for="eDate">Date</label><input type="date" id="eDate" required></div>
            <div><label for="eStart">Starts</label><input type="time" id="eStart"></div>
            <div><label for="eEnd">Ends</label><input type="time" id="eEnd"></div>
          </div>
          <label for="eNote" style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Note <span class="meta">optional</span></label>
          <input type="text" id="eNote" maxlength="600" style="margin-bottom:12px">
          <div style="font-size:.78rem;font-weight:700;margin-bottom:6px">Meeting spots</div>
          <div id="eLocs"></div>
          <button type="button" class="ghost" id="addLoc" style="margin:4px 0 14px">+ Add a meeting spot</button>
          <div class="acts"><button class="primary" type="submit">Save event</button><button class="ghost" type="button" id="cancelEv">Cancel</button><span class="status" id="evStatus" role="status"></span></div>
        </div>
      </form>
      <div id="evItems" aria-live="polite"></div>
    </div>
  </div>
</div>
<div id="lb" role="dialog" aria-label="Photo"><img alt=""></div>
<script>
const API=new URLSearchParams(location.search).get('api')||'https://api.grate.city';
const TOKEN='pk.eyJ1IjoiYmJhcnRoMSIsImEiOiJjbW1saHk2cWkxeWxwMndvcGR3cmQ4Znk4In0.qKNF4Ef-mCIVsawr9YShUg';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key='';try{key=localStorage.getItem('gc-admin')||''}catch{}
let tab='pending';
const call=(path,opt={})=>fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+key}});

async function start(){
  if(!key){$('login').hidden=false;$('app').hidden=true;$('key').focus();return}
  const r=await call('/admin/check').catch(()=>null);
  if(!r||!r.ok){$('loginErr').textContent=r&&r.status===401?'That key didn’t work.':'Couldn’t reach the submissions service.';try{localStorage.removeItem('gc-admin')}catch{};key='';$('login').hidden=false;$('app').hidden=true;return}
  $('login').hidden=true;$('app').hidden=false;load();counts();
}
$('login').onsubmit=e=>{e.preventDefault();key=$('key').value.trim();try{localStorage.setItem('gc-admin',key)}catch{};$('loginErr').textContent='';start()};
$('logout').onclick=()=>{try{localStorage.removeItem('gc-admin')}catch{};key='';$('key').value='';start()};
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.s;document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));load()});

async function load(){
  $('items').innerHTML='<p class="empty">Loading…</p>';
  const r=await call('/admin/list?status='+tab);
  if(!r.ok){$('items').innerHTML='<p class="empty">Couldn’t load submissions.</p>';return}
  const j=await r.json();
  for(const s of ['pending','approved','rejected'])$('n-'+s).textContent=j.counts[s]||0;
  if(!j.items.length){$('items').innerHTML=`<p class="empty">${tab==='pending'?'Nothing waiting for review.':'None yet.'}</p>`;return}
  $('items').innerHTML='';
  for(const s of j.items)$('items').appendChild(card(s));
}

function card(s){
  const el=document.createElement('article');el.className='card';
  const staticMap=`https://api.mapbox.com/styles/v1/mapbox/streets-v12/static/pin-l+c94a00(${s.lon},${s.lat})/${s.lon},${s.lat},17/520x360@2x?access_token=${TOKEN}`;
  const gmaps=`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  const pics=s.photo_ids.map(i=>`<img src="${API}/photo/${i}?k=${encodeURIComponent(key)}" alt="Submitted photo" loading="lazy">`).join('');
  el.innerHTML=`
    <div><a href="${gmaps}" target="_blank" rel="noopener"><img class="map" src="${staticMap}" alt="Map of the pin"></a>
      <div class="pics">${pics||'<span class="meta">No photos</span>'}</div></div>
    <div>
      <p class="meta"><b>#${s.id}</b> · sent ${esc(s.created)} UTC${s.name?` · from <b>${esc(s.name)}</b>`:''}${s.email?` · <a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:''}</p>
      ${s.note?`<p class="note">${esc(s.note)}</p>`:''}
      <div class="fields">
        <div><label for="a${s.id}">Address shown on map</label><input type="text" id="a${s.id}" value="${esc(s.address)}"></div>
        <div><label for="l${s.id}">Cleanup name</label><input type="text" id="l${s.id}" value="${esc(s.label||'')}" placeholder="Neighbor submissions"></div>
        <div><label for="d${s.id}">Date</label><input type="date" id="d${s.id}" value="${esc(s.cleaned)}"></div>
      </div>
      <div class="acts">
        ${s.status!=='approved'?`<button class="primary" data-a="approve">Approve</button>`:`<button class="primary" data-a="approve">Save changes</button>`}
        ${s.status!=='rejected'?`<button class="reject" data-a="reject">${s.status==='approved'?'Remove from map':'Reject'}</button>`:''}
        ${s.status!=='pending'?`<button class="ghost" data-a="pending">Move back to waiting</button>`:''}
        <span class="status" role="status"></span>
      </div>
    </div>`;
  el.querySelectorAll('.pics img').forEach(i=>i.onclick=()=>{$('lb').querySelector('img').src=i.src;$('lb').classList.add('on')});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const st=el.querySelector('.status');st.textContent='Saving…';st.style.color='';
    const body={address:$('a'+s.id).value,label:$('l'+s.id).value,cleaned:$('d'+s.id).value};
    const r=await call(`/admin/${s.id}/${b.dataset.a}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(()=>null);
    if(r&&r.ok){st.textContent={approve:'Approved — on the map within a minute',reject:'Done',pending:'Moved back'}[b.dataset.a];st.style.color='var(--ok)';setTimeout(load,900)}
    else{st.textContent='That didn’t save. Try again.';st.style.color='var(--bad)'}
  });
  return el;
}
$('lb').onclick=()=>$('lb').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').classList.remove('on')});

// ----- sections -----
let sec='subs';
document.querySelectorAll('.sections button').forEach(b=>b.onclick=()=>{sec=b.dataset.sec;document.querySelectorAll('.sections button').forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));
  for(const k of ['subs','reqs','evts'])$('sec-'+k).hidden=k!==sec;
  if(sec==='subs')load();if(sec==='reqs')loadReqs();if(sec==='evts')loadEvents()});
async function counts(){
  try{const a=await call('/admin/list?status=pending').then(r=>r.json());$('n-subs').textContent=a.counts.pending||0}catch{}
  try{const b=await call('/admin/requests?status=new').then(r=>r.json());$('n-reqs').textContent=b.counts.new||0}catch{}
}

// ----- requests -----
let rtab='new';
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rtab=b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-selected',x===b));loadReqs()});
async function loadReqs(){
  $('reqItems').innerHTML='<p class="empty">Loading…</p>';
  const r=await call('/admin/requests?status='+rtab);if(!r.ok){$('reqItems').innerHTML='<p class="empty">Couldn’t load requests.</p>';return}
  const j=await r.json();$('n-new').textContent=j.counts.new||0;$('n-handled').textContent=j.counts.handled||0;$('n-reqs').textContent=j.counts.new||0;
  if(!j.items.length){$('reqItems').innerHTML=`<p class="empty">${rtab==='new'?'No new requests.':'None yet.'}</p>`;return}
  $('reqItems').innerHTML='';
  const H={yes:'Neighbors will help',no:'Just them','not-sure':'Not sure about helpers'};
  for(const q of j.items){
    const el=document.createElement('article');el.className='req';
    const maps=q.lat!=null?`https://www.google.com/maps/search/?api=1&query=${q.lat},${q.lon}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.address+', New Orleans, LA')}`;
    el.innerHTML=`<h3><a href="${maps}" target="_blank" rel="noopener">${esc(q.address)}</a><span class="pill${q.helpers==='yes'?' yes':''}">${H[q.helpers]||''}${q.helpers==='yes'&&q.helpers_count?' · about '+q.helpers_count:''}</span></h3>
      <p class="meta">#${q.id} · ${esc(q.created)} UTC${q.name?' · <b>'+esc(q.name)+'</b>':''}${q.email?' · <a href="mailto:'+esc(q.email)+'?subject=Your%20Grate%20City%20cleanup%20request">'+esc(q.email)+'</a>':''}${q.phone?' · <a href="tel:'+esc(q.phone)+'">'+esc(q.phone)+'</a>':''}</p>
      ${q.note?`<p class="note">${esc(q.note)}</p>`:''}
      <div class="acts">${q.status==='new'?'<button class="primary" data-s="handled">Mark handled</button>':'<button class="ghost" data-s="new">Move back to new</button>'}<span class="status" role="status"></span></div>`;
    el.querySelector('[data-s]').onclick=async e=>{const st=el.querySelector('.status');const r=await call(`/admin/requests/${q.id}/${e.target.dataset.s}`,{method:'POST'}).catch(()=>null);if(r&&r.ok){st.textContent='Done';setTimeout(loadReqs,500)}else st.textContent='Didn’t save'};
    $('reqItems').appendChild(el);
  }
}

// ----- events -----
let editing=null;
const todayStr=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
async function loadEvents(){
  $('evItems').innerHTML='<p class="empty">Loading…</p>';
  const r=await call('/admin/events');if(!r.ok){$('evItems').innerHTML='<p class="empty">Couldn’t load events.</p>';return}
  const evs=await r.json();
  if(!evs.length){$('evItems').innerHTML='<p class="empty">No events yet.</p>';return}
  $('evItems').innerHTML='';
  for(const e of evs){
    const el=document.createElement('article');el.className='evrow'+(e.date<todayStr()?' past':'');
    el.innerHTML=`<div><b>${esc(e.title)}</b><div class="meta" style="margin:2px 0 0">${esc(e.date)}${e.start?' · '+esc(e.start)+(e.end?'–'+esc(e.end):''):''}${e.date<todayStr()?' · past':''}</div>
      <ul>${e.locations.map(l=>`<li>${esc(l.name)}${l.name?': ':''}${esc(l.place)}${l.place?', ':''}${esc(l.address)}${l.lat==null?' <span style="color:var(--bad)">(not on map)</span>':''}</li>`).join('')}</ul></div>
      <div class="acts"><button class="ghost" data-a="edit">Edit</button><button class="reject" data-a="del">Delete</button></div>`;
    el.querySelector('[data-a=edit]').onclick=()=>openForm(e);
    el.querySelector('[data-a=del]').onclick=async b=>{if(b.target.dataset.sure!=='1'){b.target.dataset.sure='1';b.target.textContent='Click again to delete';return}
      await call(`/admin/events/${e.id}/delete`,{method:'POST'});loadEvents()};
    $('evItems').appendChild(el);
  }
}
function locRow(l={}){
  const d=document.createElement('div');d.className='locrow';
  d.innerHTML=`<div><label>Name</label><input type="text" class="ln" maxlength="80" placeholder="Broadmoor" value="${esc(l.name||'')}"></div>
    <div><label>Meeting place</label><input type="text" class="lp" maxlength="120" placeholder="Rosa F. Keller Library" value="${esc(l.place||'')}"></div>
    <div><label>Address</label><input type="text" class="la" maxlength="160" placeholder="4300 S Broad St" value="${esc(l.address||'')}"></div>
    <button type="button" class="reject" aria-label="Remove this meeting spot" style="padding:9px 12px">✕</button>
    <div class="geo">${l.lat!=null?'On the map':'Will be placed on the map from the address when you save'}</div>`;
  d.dataset.lat=l.lat??'';d.dataset.lon=l.lon??'';d.dataset.addr=l.address||'';
  d.querySelector('button').onclick=()=>d.remove();
  return d;
}
function openForm(e){
  editing=e?e.id:null;$('evFormTitle').textContent=e?'Edit event':'New event';
  $('eTitle').value=e?e.title:'';$('eDate').value=e?e.date:'';$('eStart').value=e?.start||'';$('eEnd').value=e?.end||'';$('eNote').value=e?.note||'';
  $('eLocs').innerHTML='';(e?e.locations:[{}]).forEach(l=>$('eLocs').appendChild(locRow(l)));
  $('evStatus').textContent='';$('evForm').hidden=false;$('eTitle').focus();
}
$('newEv').onclick=()=>openForm(null);
$('cancelEv').onclick=()=>{$('evForm').hidden=true};
$('addLoc').onclick=()=>$('eLocs').appendChild(locRow());
$('evForm').onsubmit=async ev=>{
  ev.preventDefault();const st=$('evStatus');st.style.color='';
  if(!$('eTitle').value.trim()||!$('eDate').value){st.textContent='Add a title and date.';st.style.color='var(--bad)';return}
  st.textContent='Saving…';
  const locs=[];
  for(const d of $('eLocs').children){
    const l={name:d.querySelector('.ln').value.trim(),place:d.querySelector('.lp').value.trim(),address:d.querySelector('.la').value.trim(),lat:d.dataset.lat===''?null:+d.dataset.lat,lon:d.dataset.lon===''?null:+d.dataset.lon};
    if(!l.name&&!l.place&&!l.address)continue;
    if(l.address&&(l.lat==null||l.address!==d.dataset.addr)){
      try{const j=await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(l.address+', New Orleans, LA')}.json?proximity=-90.08,29.95&limit=1&access_token=${TOKEN}`).then(r=>r.json());const c=j.features&&j.features[0]&&j.features[0].center;if(c){l.lon=c[0];l.lat=c[1]}else{l.lat=l.lon=null}}catch{l.lat=l.lon=null}
    }
    locs.push(l);
  }
  const body={title:$('eTitle').value,date:$('eDate').value,start:$('eStart').value,end:$('eEnd').value,note:$('eNote').value,locations:locs};
  const r=await call(editing?`/admin/events/${editing}`:'/admin/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(()=>null);
  if(r&&r.ok){st.textContent='Saved';st.style.color='var(--ok)';$('evForm').hidden=true;loadEvents()}else{st.textContent='That didn’t save. Try again.';st.style.color='var(--bad)'}
};
start();
</script>
</body>
</html>
