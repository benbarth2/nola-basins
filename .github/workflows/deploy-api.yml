name: Deploy submissions API

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 225e04179dd068b4f60ea5a4f229c545
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first."; exit 1; fi
          if [ -z "${{ secrets.ADMIN_KEY }}" ]; then echo "::error::Add the ADMIN_KEY repository secret first."; exit 1; fi
      - run: npm i --no-save wrangler@4.40.0
      - name: Find or create the database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="grate-city") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create grate-city
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="grate-city") | .uuid' | head -1)
          fi
          echo "Database: $ID"
          sed -i "s/DATABASE_ID/$ID/" wrangler.toml
      - run: npx wrangler d1 migrations apply grate-city --remote
      - run: npx wrangler deploy
      - name: Set admin key
        run: printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
